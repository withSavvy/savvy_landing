name: merge-guard

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

jobs:
  merge-guard:
    # Label-only check: no secrets, no build, no VM-local state. It MUST NOT
    # queue behind the scarce self-hosted pool. A merge-gating check that
    # cannot get a runner wedges every PR in the repo with no way to unstick
    # it: a queued run that was never assigned cannot be cancelled (a 202 is
    # ignored), cannot be retired by concurrency, and does not die when its
    # PR closes.
    #
    # This previously read `vars.CI_RUNNER || 'ubuntu-latest'` under a comment
    # claiming it was "pinned to GitHub-hosted". That claim was FALSE, and the
    # comment is why nobody noticed: `CI_RUNNER` IS the scarce self-hosted
    # pool, and `||` short-circuits on the variable being SET, not on a runner
    # being available. So wherever CI_RUNNER is set, this check routed to
    # exactly the pool the comment said it avoided.
    #
    # Measured 2026-08-13 on savvy-frontend#177 (public legal pages): this
    # check sat queued 18+ minutes and never started, while the identical
    # check on savvy-backend — where CI_RUNNER happens to be unset —
    # completed in 5 seconds. Every substantive gate on that PR was green; it
    # took a break-glass merge to land, purely because the gate could not get
    # a runner. The same pool outage swallowed four board-action dispatches
    # the same hour.
    #
    # THE FIX ABOVE REPRODUCED THE BUG IT CURED, ONE VARIABLE UP. Measured on
    # this repo 2026-09-19: CI_RUNNER=ubuntu-latest (so every other workflow
    # here runs fine) but CI_RUNNER_OVERFLOW=self-hosted-ci, which makes the
    # `||` short-circuit on the FIRST term and routes this check straight back
    # to the scarce pool. merge-guard was the only workflow in the repo on
    # those two variables and the only one that never started: five runs
    # queued and unassigned, the oldest 13+ minutes, while gate, ci, deploy
    # and auto-arm-merge all completed in the same window.
    #
    # It has been that way since 2026-07-17T22:48:44Z. The repo variable
    # CI_OVERFLOW_STATE reads {"overflowedAt":"2026-07-17T22:48:44.137Z",
    # "lastHealthyAt":null} — flipped into overflow 64 days ago and never
    # flipped back, because the flip-back cannot fire (tracked separately by
    # [wo:ci-runner-guard-persist-overflow-state-so-flip-back-can-ever-fire]).
    # An overflow flag that only ever latches ON makes "unset is a no-op" a
    # promise this file cannot keep.
    #
    # So stop deriving this from variables at all. The first paragraph of this
    # comment is the actual requirement — label-only, no secrets, no build, no
    # VM-local state, MUST NOT queue behind the scarce pool — and a literal is
    # the only way to state it that no variable can later contradict. This
    # check has no reason to ever want a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Check for hold labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIER_B_RELEASE_ACTORS: ${{ vars.TIER_B_RELEASE_ACTORS }}
        run: |
          set -uo pipefail

          # Labels are read LIVE via the API, never from $GITHUB_EVENT_PATH
          # (a payload snapshot frozen at whatever moment triggered this
          # run). A stale-payload read means a re-run of this job replays
          # the OLD label state — `gh run rerun` looks like a fresh check
          # but isn't one; only a genuinely new labeled/unlabeled/
          # synchronize event (see `on.pull_request.types` above)
          # re-evaluates correctly. Fail-closed: an unreadable label list
          # blocks the merge rather than reading as "no holds".
          LABELS=""
          read_live_labels() {
            local raw
            if raw=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name' 2>&1); then
              LABELS="$raw"
              return 0
            fi
            echo "::error::Could not read live PR labels — refusing to clear (fail-closed): $raw"
            exit 1
          }
          read_live_labels

          has() { printf '%s\n' "$LABELS" | grep -qxiE "$1"; }

          # `do-not-merge` is absolute and deliberately NOT overridable. It is
          # the label used to park something dangerous; if `human-approved`
          # could override it the two would cancel out and the stronger signal
          # would lose. Removing `do-not-merge` IS the override.
          # `hold` is included here after a live near-miss on #728: the gate's
          # own "Clear stale needs-human-review / gate-infra-error labels on
          # clean pass" step removed the `needs-human-review` that was holding
          # it (correctly — Opus had returned PASS), leaving only `hold`. This
          # check did not block on `hold`, every other check was green, and the
          # only red was a STALE merge-guard run evaluated against a label that
          # no longer existed. One re-trigger would have made a Tier-B billing
          # change mergeable with nobody having approved it — the same shape as
          # #701, which auto-merged past its own stated hold hours earlier.
          #
          # `hold` reads like a hold, is used like one, and workflow-pr-admin-
          # merge.yml already treats it as one (^(do-not-merge|reviewing|hold|
          # needs-human-review)$). Only this check disagreed. Two workflows in
          # one repo disagreeing about what "held" means is how a PR ends up
          # looking parked while being freely mergeable by the gate that
          # actually decides.
          #
          # Grouped with `do-not-merge` rather than with the advisory holds:
          # both are applied deliberately to park something, so neither should
          # be overridable by `human-approved` — removing the label is the
          # override.
          if has 'do-not-merge|hold'; then
            echo "::error::PR carries 'do-not-merge' or 'hold' — absolute hold. Remove that label to merge; 'human-approved' does not override it."
            exit 1
          fi

          # Why an override exists at all
          # -----------------------------
          # gate.yml applies `needs-human-review` for TWO different situations
          # that are indistinguishable from here: a human genuinely needs to
          # judge the change, or THE REVIEWER COULD NOT RUN (429 usage cap, 401
          # on REVIEWER_SUB_OAUTH_TOKEN, crash, incomplete review). gate.yml's
          # own logs call the second case "not a permanent block". It was one:
          # the only thing that clears the label is gate.yml's "Clear stale
          # needs-human-review / gate-infra-error labels on clean pass" step,
          # which is gated on the reviewer returning PASS. A reviewer that
          # cannot run never returns PASS, so the label never clears — and
          # every re-run re-applies it, so removing it by hand loses to the
          # next run. During a quota outage that is a wall, not a hold.
          #
          # Blocking an UNREVIEWED PR is correct and is kept. What was missing
          # is a way for a human to say "I reviewed this myself" and have it
          # stick. gate.yml never adds or removes `human-approved`, so unlike
          # removing `needs-human-review` by hand, no re-run can undo it.
          # [2026-10-02, savvy-backend#1595 / tracking #1239 — ported to savvy_landing]
          # PRESENCE of the label used to be treated as proof a human reviewed
          # the PR (this repo accepted it verbatim). It is not: anyone with
          # label-write access can add it, and since 2026-10-02 `human-approved`
          # is ALSO the SHA-bound override of the required `opus-verdict-recorded`
          # status and the only way past the CI-surface floor below. So it is
          # honoured only when an allowlisted, non-bot human added it — the same
          # check the override job runs (.github/scripts/verify_human_approved.sh).
          #
          # KNOWN LIMIT: a caller holding the allowlisted human's PAT is
          # indistinguishable from that human; this closes forgery by other
          # logins and by bots, not a stolen credential. The allowlist is the
          # TIER_B_RELEASE_ACTORS repo/org variable; UNSET falls back to the repo
          # OWNER login, which matches no real actor, so nothing verifies (and
          # `human-approved` releases nothing) until it is set.
          #
          # This function is ALSO shipped as .github/scripts/verify_human_approved.sh.
          # merge-guard has no checkout step (and must not grow one: it is a
          # required label-only check on the hosted pool), so it keeps this inline
          # copy. .github/scripts/__tests__/verify_human_approved.test.sh asserts
          # the two bodies are byte-identical (modulo indentation) — edit BOTH or
          # that test fails.
          verified_human_approved_adder() {
            local allow raw login login_lc entry
            allow="${TIER_B_RELEASE_ACTORS:-${GITHUB_REPOSITORY%%/*}}"

            if ! raw=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events" \
                         --paginate --jq '.[] | select(.event=="labeled" and .label.name=="human-approved") | .actor.login' 2>&1); then
              echo "::warning::Could not read issue events to verify who added 'human-approved' — treating it as unverifiable (fail-closed): $raw"
              return 1
            fi

            # Multiple 'labeled human-approved' events can exist (label
            # removed and re-added); the newest one is what currently governs,
            # and the events API returns them oldest-first, so the last line
            # is the most recent — same "live, not the triggering snapshot"
            # rule as read_live_labels() above.
            login=$(printf '%s\n' "$raw" | tail -n1)
            if [ -z "$login" ] || [ "$login" = "null" ]; then
              echo "::warning::'human-approved' is present but no matching 'labeled' event was found for it — treating it as unverifiable (fail-closed)."
              return 1
            fi

            login_lc=$(printf '%s' "$login" | tr '[:upper:]' '[:lower:]')
            case "$login_lc" in
              *"[bot]")
                echo "::warning::'human-approved' was added by '$login', a bot identity — treating it as unverifiable (fail-closed): a bot does not assert human review."
                return 1
                ;;
            esac
            for entry in $(printf '%s' "$allow" | tr ',' ' ' | tr '[:upper:]' '[:lower:]'); do
              if [ "$entry" = "$login_lc" ]; then
                echo "'human-approved' was added by '$login', on the tier-b release allowlist ('$allow')."
                export HUMAN_APPROVED_ADDER="$login"
                return 0
              fi
            done
            echo "::warning::'human-approved' was added by '$login', who is NOT on the tier-b release allowlist ('$allow') — treating it as unverifiable (fail-closed)."
            return 1
          }

          if has 'human-approved'; then
            if verified_human_approved_adder; then
              echo "PR carries 'human-approved' — a human has reviewed this and cleared it."
              echo "Advisory holds ('reviewing', 'needs-human-review') are ignored."
              exit 0
            fi
            echo "::error::'human-approved' is present but its adder could not be verified — treating it as ABSENT (fail-closed)."
          fi

          if has 'reviewing|needs-human-review'; then
            echo "::error::PR is on hold ('reviewing' or 'needs-human-review')."
            echo "If the gate applied this because its reviewer could not run (429 usage cap, 401 auth, crash), the label will NOT clear on its own until a review actually succeeds."
            echo "To merge anyway after reviewing it yourself, add the 'human-approved' label."
            exit 1
          fi

          # [2026-10-02, savvy-backend#1595 / tracking #1239 — ported to savvy_landing]
          # LIVE CI-SURFACE FLOOR. savvy_landing had no CI-surface check in this
          # required job: gate.yml's review/opus-gate compute it, but they are NOT
          # required and start only after the required checks finish, and
          # auto-arm-merge.yml labels a brick-risk PR `do-not-merge` only on
          # opened/ready_for_review/labeled — never on a later push. So a PR could
          # add or change a workflow after opening and merge unlabeled.
          #
          # That matters more now: the binding `opus-verdict-recorded` status is
          # posted by github-actions[bot] from gate.yml. A same-repo PR that edits
          # .github/workflows could post that status itself, so this required check
          # must refuse CI-surface PRs unless a VERIFIED human approved them (the
          # `human-approved` branch above has already exited 0 in that case). The
          # file list is read live from the API, never from the event payload.
          #
          # RESIDUAL (documented, same as savvy-backend): this job runs from the PR's
          # own merge ref, so a PR that edits merge-guard.yml itself is judged by its
          # own copy. The backstops are the SHA-bound human override and CODEOWNERS /
          # branch rules, not this file.
          if ! PR_FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' 2>&1); then
            echo "::error::Could not read live PR file list — refusing to clear (fail-closed): $PR_FILES"
            exit 1
          fi
          if printf '%s\n' "$PR_FILES" | grep -Eq '^[.]github/(workflows|scripts)/|^[.]claude/scripts/'; then
            echo "::error::PR touches CI-surface paths (.github/workflows/, .github/scripts/, .claude/scripts/) — human-review floor, evaluated here so it cannot be outrun by a slower job. Add 'human-approved' (as an allowlisted human) after reviewing this diff to merge."
            exit 1
          fi

          echo "PR is clear to merge."
